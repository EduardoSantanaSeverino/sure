# Builds the deployable UAT image without changing the upstream-tracking main branch.
name: Publish UAT Docker image

on:
  push:
    branches:
      - uat
    paths-ignore:
      - 'charts/**'
      - 'mobile/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eduardosantanaseverino/sure
  # Change to "true" to publish both AMD64 and ARM64 images.
  BUILD_ARM64: "false"

permissions:
  contents: write
  packages: write

jobs:
  platforms:
    name: Select image platforms
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      list: ${{ steps.select.outputs.list }}
      include: ${{ steps.select.outputs.include }}
      image_tag: ${{ steps.timestamp.outputs.image_tag }}
    steps:
      - id: timestamp
        shell: bash
        run: echo "image_tag=v$(date -u +%Y-%m-%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - id: select
        shell: bash
        run: |
          if [[ "$BUILD_ARM64" == "true" ]]; then
            echo 'matrix=["amd64","arm64"]' >> "$GITHUB_OUTPUT"
            echo 'include=[{"platform":"amd64","runs-on":"self-hosted"},{"platform":"arm64","runs-on":"self-hosted-arm"}]' >> "$GITHUB_OUTPUT"
            echo 'list=amd64 arm64' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["amd64"]' >> "$GITHUB_OUTPUT"
            echo 'include=[{"platform":"amd64","runs-on":"self-hosted"}]' >> "$GITHUB_OUTPUT"
            echo 'list=amd64' >> "$GITHUB_OUTPUT"
          fi

  ci:
    uses: ./.github/workflows/ci.yml
    with:
      require_js_dependency_audit: false

  build:
    name: Build UAT Docker image
    needs: [ci, platforms]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.include) }}

    timeout-minutes: 60
    runs-on: ${{ matrix.runs-on }}

    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to the container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current date (RFC 3339 format)
        id: date
        run: echo "date=$(date -Iseconds)" >> "$GITHUB_OUTPUT"

      - name: Configure image tags
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=uat
            type=raw,value=${{ needs.platforms.outputs.image_tag }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.vendor=we-promise
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.title=Sure UAT
            org.opencontainers.image.description=A multi-architecture UAT Docker image for Sure

      - name: Publish linux/${{ matrix.platform }} image by digest
        id: image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          build-args: BUILD_COMMIT_SHA=${{ github.sha }}
          platforms: linux/${{ matrix.platform }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-uat-${{ matrix.platform }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-uat-${{ matrix.platform }},mode=max
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},name-canonical=true,push-by-digest=true,oci-mediatypes=true

      - name: Export Docker image digest
        run: |
          mkdir -p "${RUNNER_TEMP}"/digests
          echo "${DIGEST#sha256:}" > "${RUNNER_TEMP}/digests/digest-${PLATFORM}"
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}

      - name: Upload Docker image digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: uat-digest-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-architecture UAT image
    needs: [build, platforms]
    timeout-minutes: 60
    runs-on: self-hosted

    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Download Docker image digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: uat-digest-*
          merge-multiple: true

      - name: Log in to the container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-architecture image tags
        env:
          TAGS: ${{ needs.build.outputs.tags }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
          PLATFORMS: ${{ needs.platforms.outputs.list }}
        shell: bash -xeuo pipefail {0}
        run: |
          tag_args=()
          while IFS=$'\n' read -r tag; do
            [[ -n "${tag}" ]] || continue
            tag_args+=("--tag=${tag}")
          done <<< "${TAGS}"

          image_args=()
          for PLATFORM in ${PLATFORMS}; do
            image_args+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:$(<"${DIGESTS_DIR}/digest-${PLATFORM}")")
          done

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.ref.name=${{ github.ref_name }}" \
            --annotation "index:org.opencontainers.image.title=Sure UAT" \
            --annotation "index:org.opencontainers.image.description=A multi-architecture UAT Docker image for Sure" \
            "${tag_args[@]}" \
            "${image_args[@]}"
